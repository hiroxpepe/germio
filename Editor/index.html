<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>germio.json editor</title>
<style>
  :root {
    --surface-0: #f7f7f5; --surface-1: #ffffff; --surface-2: #f1f1ef;
    --border: #e4e4e0; --border-strong: #d0d0cb;
    --text-primary: #1a1a18; --text-secondary: #6b6b65; --text-muted: #9a9a93;
    --accent: #2f6fb3; --accent-bg: #e8f0f9; --accent-border: #2f6fb3;
    --success: #1f8a5f; --success-bg: #e6f4ec;
    --warning: #a3690f; --warning-bg: #faf1e0;
    --danger: #c23b3b; --danger-bg: #fbeaea;
    --radius: 8px;
    --font-sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", Consolas, "Cascadia Code", monospace;
  }
  body {
    font-family: var(--font-sans); font-size: 13px; color: var(--text-primary);
    margin: 1.5rem; background: var(--surface-0);
  }
  #app { max-width: 980px; }
  button {
    border-radius: var(--radius); border: 0.5px solid var(--border-strong);
    background: var(--surface-1); color: var(--text-primary);
    padding: 5px 12px; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  button:hover { background: var(--surface-2); }
  button:disabled { opacity: 0.4; cursor: default; }
  input, select {
    border: 0.5px solid var(--border-strong); border-radius: var(--radius);
    font-family: inherit; font-size: 13px; padding: 5px 8px; background: var(--surface-1);
    color: var(--text-primary);
  }
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.75rem 1.25rem; background: var(--surface-1);
    border: 0.5px solid var(--border); border-radius: 12px 12px 0 0; border-bottom: none;
  }
  #status { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
  #status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--success); display: inline-block; }
  #body {
    display: grid; grid-template-columns: 1.2fr 1fr;
    border: 0.5px solid var(--border); border-radius: 0 0 12px 12px; overflow: hidden;
    background: var(--surface-1);
  }
  #tree-panel { border-right: 0.5px solid var(--border); }
  #tree[role="tree"] { padding: 4px 0; }
  .node-row {
    padding: 8px 20px; display: flex; align-items: center; gap: 8px; cursor: pointer;
    border-bottom: 0.5px solid var(--border); font-family: var(--font-mono); font-size: 13px;
  }
  .node-row[aria-selected="true"] { background: var(--accent-bg); color: var(--accent); }
  .node-row button { padding: 1px 5px; font-size: 11px; border-radius: 5px; }
  #tree-panel > button { margin: 10px 20px; }
  #main-panel { padding: 1.125rem 1.25rem; }
  #tabs button { font-size: 13px; margin-right: 4px; }
  #tabs button[aria-selected="true"] { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .rule-card {
    background: var(--surface-2); border-radius: var(--radius); padding: 8px 12px;
    margin-bottom: 6px; cursor: pointer; font-family: var(--font-mono); font-size: 12px;
    color: var(--text-secondary); display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .rule-card[aria-selected="true"] { box-shadow: 0 0 0 1.5px var(--accent); }
  .badge {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    padding: 2px 8px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.02em;
  }
  .badge-request_transition, .badge-set_persistence { background: var(--accent-bg); color: var(--accent); }
  .badge-request_notify, .badge-record_event { background: var(--success-bg); color: var(--success); }
  .badge-set_flag, .badge-update_counter, .badge-update_inventory { background: var(--warning-bg); color: var(--warning); }
  #rule-editor-panel { background: var(--surface-2); border-radius: var(--radius); padding: 1rem 1.125rem; margin-top: 0.75rem; }
  #rule-editor-panel label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 4px; }
  #rule-editor-panel input { font-family: var(--font-mono); width: 100%; box-sizing: border-box; }
  #command-kinds > div { margin-bottom: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #warnings { margin-top: 1rem; }
  .level-Error { background: var(--danger-bg); color: var(--danger); padding: 4px 8px; border-radius: 5px; font-size: 12px; margin-bottom: 3px; }
  .level-Warning { background: var(--warning-bg); color: var(--warning); padding: 4px 8px; border-radius: 5px; font-size: 12px; margin-bottom: 3px; }
</style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div>
        <button id="open-btn"><i></i>Open germio.json</button>
        <button id="save-btn" disabled>Save</button>
        <button id="undo-btn" disabled>Undo</button>
        <button id="copy-log-btn">Copy log</button>
        <button id="download-log-btn">Download log</button>
      </div>
      <div id="status">no file open</div>
    </div>
    <div id="body">
      <div id="tree-panel">
        <div id="tree"></div>
        <button id="add-node-btn" disabled>+ add node</button>
        <button id="delete-node-btn" disabled>delete node</button>
      </div>
      <div id="main-panel">
        <div id="tabs">
          <button data-tab="rules" aria-selected="true">Rules</button>
          <button data-tab="node" aria-selected="false">Node</button>
          <button data-tab="state" aria-selected="false">State</button>
        </div>
        <div class="tab-content active" id="tab-rules">
          <div id="rule-list"></div>
          <button id="add-rule-btn" disabled>+ add rule</button>
          <div id="rule-editor-panel"></div>
        </div>
        <div class="tab-content" id="tab-node">
          <div id="node-panel"></div>
        </div>
        <div class="tab-content" id="tab-state">
          <div id="state-panel"></div>
        </div>
        <div id="warnings"></div>
      </div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
