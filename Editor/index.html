<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>germio.json editor</title>
<style>
  :root {
    --surface-0: #f7f7f5; --surface-1: #ffffff; --surface-2: #f1f1ef;
    --border: #e4e4e0; --border-strong: #d0d0cb;
    --text-primary: #1a1a18; --text-secondary: #6b6b65; --text-muted: #9a9a93;
    --accent: #2f6fb3; --accent-bg: #e8f0f9; --accent-border: #2f6fb3;
    --success: #1f8a5f; --success-bg: #e6f4ec;
    --warning: #a3690f; --warning-bg: #faf1e0;
    --danger: #c23b3b; --danger-bg: #fbeaea;
    --font-sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", Consolas, "Cascadia Code", monospace;
  }
  body {
    font-family: var(--font-sans); font-size: 13px; color: var(--text-primary);
    margin: 1.5rem; background: var(--surface-0);
  }
  #app { max-width: 980px; }
  button {
    border-radius: 8px; border: 0.5px solid var(--border-strong);
    background: var(--surface-1); color: var(--text-primary);
    padding: 0 16px; height: 36px; cursor: pointer; font-family: inherit; font-size: 13px;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  button:hover { background: var(--surface-2); }
  button:disabled { opacity: 0.4; cursor: default; }
  input, select {
    border: 0.5px solid var(--border-strong); border-radius: 8px;
    font-family: inherit; font-size: 13px; height: 36px; padding: 0 10px;
    background: var(--surface-1); color: var(--text-primary); box-sizing: border-box;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px; background: var(--surface-1);
    border: 0.5px solid var(--border); border-radius: 16px 16px 0 0; border-bottom: none;
  }
  #topbar > div:first-child { display: flex; gap: 8px; }
  #open-btn { font-weight: 500; }
  #undo-btn { width: 36px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  #status {
    font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px;
  }
  #status::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--success); display: inline-block;
  }
  #body {
    display: grid; grid-template-columns: 260px 1fr;
    border: 0.5px solid var(--border); border-radius: 0 0 16px 16px; overflow: hidden;
    background: var(--surface-1);
  }
  #tree-panel { border-right: 0.5px solid var(--border); padding: 20px 12px; }
  .section-label {
    font-size: 11px; font-weight: 500; color: var(--text-muted);
    letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 12px; padding: 0 12px;
  }
  #tree[role="tree"] { display: flex; flex-direction: column; gap: 2px; }
  .node-row {
    padding: 9px 12px; display: flex; align-items: center; gap: 8px; cursor: pointer;
    border-radius: 8px; font-family: var(--font-mono); font-size: 13px; color: var(--text-secondary);
    transition: background 0.12s ease;
  }
  .node-row:hover { background: var(--surface-2); }
  .node-row[aria-selected="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 500; }
  .node-row button {
    padding: 0; width: 18px; height: 18px; font-size: 10px; border-radius: 4px;
    border: none; background: transparent; color: var(--text-muted); opacity: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .node-row:hover button { opacity: 1; }
  .node-row button:hover { background: var(--surface-1); color: var(--text-primary); }
  #tree-panel > button { width: 100%; margin-top: 16px; height: 34px; }
  #tree-panel > button + button { margin-top: 8px; }
  #main-panel { padding: 28px 32px; }
  #tabs { display: flex; gap: 8px; margin-bottom: 24px; }
  #tabs button { height: 32px; font-size: 13px; }
  #tabs button[aria-selected="true"] { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  #rule-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .rule-card {
    background: var(--surface-2); border-radius: 10px; padding: 14px 16px;
    cursor: pointer; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    transition: box-shadow 0.12s ease; font-family: var(--font-mono); font-size: 13px; color: var(--text-secondary);
  }
  .rule-card[aria-selected="true"] { box-shadow: 0 0 0 1.5px var(--accent-border); }
  #add-rule-btn { height: 34px; margin-bottom: 28px; }
  .badge {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    padding: 4px 10px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .badge-request_transition, .badge-set_persistence { background: var(--accent-bg); color: var(--accent); }
  .badge-request_notify, .badge-record_event { background: var(--success-bg); color: var(--success); }
  .badge-set_flag, .badge-update_counter, .badge-update_inventory { background: var(--warning-bg); color: var(--warning); }
  #rule-editor-panel {
    background: var(--surface-2); border-radius: 12px; padding: 24px 28px; display: none;
  }
  #rule-editor-panel > div:first-child {
    font-size: 12px; font-weight: 500; color: var(--text-muted);
    letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 20px;
  }
  #rule-editor-panel label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 6px; }
  #rule-editor-panel input { font-family: var(--font-mono); width: 100%; }
  #rule-editor-panel > div > div { margin-bottom: 18px; }
  #command-kinds > div { margin-bottom: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #node-panel, #state-panel { display: flex; flex-direction: column; gap: 18px; }
  #warnings { margin-top: 20px; }
  .level-error {
    background: var(--danger-bg); color: var(--danger); padding: 6px 10px;
    border-radius: 6px; font-size: 12px; margin-bottom: 4px;
  }
  .level-warning {
    background: var(--warning-bg); color: var(--warning); padding: 6px 10px;
    border-radius: 6px; font-size: 12px; margin-bottom: 4px;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div>
        <button id="open-btn"><i class="ti ti-folder-open" style="margin-right:6px"></i>Open germio.json</button>
        <button id="save-btn" disabled>Save</button>
        <button id="undo-btn" disabled><i class="ti ti-arrow-back-up"></i></button>
        <button id="copy-log-btn">Copy log</button>
        <button id="download-log-btn">Download log</button>
      </div>
      <div id="status">no file open</div>
    </div>
    <div id="body">
      <div id="tree-panel">
        <div class="section-label">Nodes</div>
        <div id="tree"></div>
        <button id="add-node-btn" disabled>+ add node</button>
        <button id="delete-node-btn" disabled>delete node</button>
      </div>
      <div id="main-panel">
        <div style="margin-bottom: 24px;">
          <div class="section-label" style="margin-bottom: 4px;">Selected node</div>
          <div id="selected-node-name" style="font-size: 20px; font-weight: 500; font-family: var(--font-mono);"></div>
        </div>
        <div id="tabs">
          <button data-tab="rules" aria-selected="true">Rules</button>
          <button data-tab="node" aria-selected="false">Node</button>
          <button data-tab="state" aria-selected="false">State</button>
        </div>
        <div class="tab-content active" id="tab-rules">
          <div id="rule-list"></div>
          <button id="add-rule-btn" disabled>+ add rule</button>
          <div id="rule-editor-panel"></div>
        </div>
        <div class="tab-content" id="tab-node">
          <div id="node-panel"></div>
        </div>
        <div class="tab-content" id="tab-state">
          <div id="state-panel"></div>
        </div>
        <div id="warnings"></div>
      </div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
